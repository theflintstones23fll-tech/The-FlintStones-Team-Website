{% extends "base.html" %}
{% block title %}Login — The Flintstones{% endblock %}
{% block content %}

<section class="auth-section">
    <div class="auth-strata">
        <div class="strata strata-2"></div>
        <div class="strata strata-3"></div>
    </div>
    <div class="auth-container">
        <div class="auth-logo">
            <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Logo">
        </div>
        <h1 class="auth-title" data-i18n="login.title">Welcome Back</h1>
        <p class="auth-subtitle" data-i18n="login.sub">Log in to access the Score Calculator</p>

        <form class="auth-form" method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username" data-i18n="login.user">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password" data-i18n="login.pass">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full" data-i18n="login.btn">Login ⛏</button>
        </form>

        <div class="auth-footer">
            <p><span data-i18n="login.noacc">No account?</span> <a href="{{ url_for('register') }}" data-i18n="login.register">Register here</a></p>
        </div>
    </div>
</section>

{% endblock %}
